name: Feature request
description: Suggest a format, a grouping behavior, or a flag imgdupe doesn't have yet.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >-
        An image format, a grouping behavior, or an output that imgdupe
        currently doesn't support.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What should imgdupe do
      description: A new flag, a new format, a new output — be as concrete as you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried instead
      description: A workaround, another tool, a manual check — helps judge how much this is worth.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a PR for this
          required: false
